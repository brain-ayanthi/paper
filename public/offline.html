<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — POS</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        /* Inline-only — this page can't request external CSS while
         * offline. Keep it minimal and self-contained. */
        :root {
            --bg:      #0a0a0a;
            --surface: #1a1a1a;
            --fg:      #f4f4f5;
            --muted:   #a1a1aa;
            --accent:  #3b82f6;
            --border:  #27272a;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg:      #f4f4f5;
                --surface: #ffffff;
                --fg:      #0a0a0a;
                --muted:   #71717a;
                --border:  #e4e4e7;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
            text-align: center;
        }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #b91c1c;
            margin-inline-end: 8px;
            vertical-align: middle;
            animation: pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }
        h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        p {
            font-size: 14px;
            line-height: 1.55;
            color: var(--muted);
            margin: 0 0 18px;
        }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        small {
            display: block;
            margin-top: 18px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1><span class="dot"></span> You're offline</h1>
        <p>The cashier app couldn't be loaded from the network. If you've used it on this device before, try opening it from the home screen — the saved copy might still work.</p>
        <button onclick="location.reload()">Try again</button>
        <small>This screen is shown by the service worker when both the network and the cached app shell are unavailable.</small>
    </main>
</body>
</html>
